services:
  postgres:
    image: postgres:16-alpine
    container_name: siteflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siteflow
      POSTGRES_PASSWORD: siteflow_dev_password
      POSTGRES_DB: siteflow
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5434:5432"
    volumes:
      - siteflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteflow -d siteflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: siteflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: siteflow
      MINIO_ROOT_PASSWORD: siteflow_minio_dev
      TZ: Asia/Kolkata
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - siteflow_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: siteflow-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 siteflow siteflow_minio_dev;
      mc mb -p local/siteflow-uploads || true;
      mc anonymous set download local/siteflow-uploads || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: siteflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://siteflow:siteflow_dev_password@postgres:5432/siteflow?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-dev-only-32chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-dev-only-32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      TZ: Asia/Kolkata
      APP_TIMEZONE: Asia/Kolkata
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:3001/uploads
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: siteflow-uploads
      S3_ACCESS_KEY: siteflow
      S3_SECRET_KEY: siteflow_minio_dev
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3001:3001"
    volumes:
      - siteflow_uploads:/app/uploads
    profiles:
      - full

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: siteflow-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  siteflow_pgdata:
  siteflow_minio:
  siteflow_uploads:
